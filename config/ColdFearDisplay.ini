[Display]
Enabled=1
; 0/0 detects the primary desktop.
NativeWidth=0
NativeHeight=0
; -1: automatic; 0: saved mode; 1: always follow desktop.
UseDesktopResolution=-1
; Set both dimensions to force a mode.
ResolutionWidth=0
ResolutionHeight=0

[CameraMod]
